<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>타로 카드 보기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tarot-container">
        <h1>오늘의 타로 운세</h1>
        <p>카드를 한 장 선택해주세요.</p>
        
        <!-- 카드 목록 (예시로 3장만 배치) -->
        <div class="card-list">
            <div class="tarot-card" onclick="flipCard(this, '바보 (The Fool)', '새로운 시작과 도전의 시기입니다.')">
                <div class="card-inner">
                    <div class="card-back">TAROT</div>
                    <div class="card-front">🃏<br>바보</div>
                </div>
            </div>
            
            <div class="tarot-card" onclick="flipCard(this, '마법사 (The Magician)', '당신의 재능과 잠재력이 발휘될 때입니다.')">
                <div class="card-inner">
                    <div class="card-back">TAROT</div>
                    <div class="card-front">🔮<br>마법사</div>
                </div>
            </div>

            <div class="tarot-card" onclick="flipCard(this, '여사제 (The High Priestess)', '직관을 믿고 신중하게 결정하세요.')">
                <div class="card-inner">
                    <div class="card-back">TAROT</div>
                    <div class="card-front">📜<br>여사제</div>
                </div>
            </div>
        </div>

        <!-- 결과가 출력될 공간 -->
        <div id="result-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
